<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jeils · Evaluación de locación</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin-top: .75rem; }
    input, button { padding: .5rem; font-size: 1rem; }
    .aviso { background: #fff3cd; padding: .5rem; margin-top: .5rem; border-radius: 4px; }
    pre { background: #f4f4f4; padding: 1rem; overflow: auto; }
  </style>
</head>
<body>
  <h1>Evaluación de locación</h1>
  <p><em>Datos históricos; no constituyen un pronóstico.</em></p>
  <form id="f">
    <label>Departamento <input name="departamento" required></label>
    <label>Provincia <input name="provincia"></label>
    <label>Distrito <input name="distrito"></label>
    <label>Fecha del evento <input type="date" name="fecha" required></label>
    <p><button>Evaluar</button></p>
  </form>
  <div id="estado"></div>
  <div id="avisos"></div>
  <pre id="resultado"></pre>
  <script>
    // TODO(integrante 5): reemplazar este placeholder por la vista final (spec 05).
    document.getElementById("f").addEventListener("submit", async (e) => {
      e.preventDefault();
      const d = Object.fromEntries(new FormData(e.target));
      const body = { locacion: { departamento: d.departamento, provincia: d.provincia || null, distrito: d.distrito || null }, fecha_evento: d.fecha };
      const estado = document.getElementById("estado");
      estado.textContent = "Consultando...";
      try {
        const r = await fetch("/api/v1/evaluacion", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
        if (!r.ok) throw new Error("Error " + r.status);
        const j = await r.json();
        document.getElementById("avisos").innerHTML = j.advertencias.map(a => `<div class="aviso">${a.replace(/</g, "&lt;")}</div>`).join("");
        document.getElementById("resultado").textContent = JSON.stringify(j, null, 2);
        estado.textContent = "";
      } catch (err) {
        estado.textContent = "No se pudo completar la consulta: " + err.message;
      }
    });
  </script>
</body>
</html>
